name: Minimum Go verification
on:
  push:
    branches: ['ci/naru-038-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Assert native target and record environment
        run: |
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(go env GOHOSTARCH)" = amd64
          uname -a
          git rev-parse HEAD
          go version
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH GOTOOLCHAIN
      - name: Prepare pinned development tools
        run: sh scripts/setup-devtools.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.12'
          cache: false
      - name: Assert minimum toolchain
        run: |
          test "$(go version)" = 'go version go1.23.12 linux/amd64'
          go version
          go env GOTOOLCHAIN GOHOSTARCH
      - name: Format and native vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Full race suite
        run: go test -race -count=1 -v ./...
      - name: Cross-platform vet
        run: |
          GOOS=windows go vet ./...
          GOOS=linux go vet ./...
      - name: Build application with minimum Go
        run: |
          go build -o "$RUNNER_TEMP/naru-minimum" ./cmd/naru
          go version -m "$RUNNER_TEMP/naru-minimum"
          "$RUNNER_TEMP/naru-minimum" version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and dogfood all checks
        run: |
          go build -o "$RUNNER_TEMP/naru" ./cmd/naru
          "$RUNNER_TEMP/naru" check
      - name: Print analysis summaries
        if: always()
        run: |
          find .naru/state -name issues.md -type f -exec cat {} \;
