name: Native Linux verification
on:
  push:
    branches: [main, 'ci/naru-039-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.12', '1.27.3']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Assert native target and record environment
        run: |
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(go env GOHOSTARCH)" = amd64
          uname -a
          git rev-parse HEAD
          go version
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH GOTOOLCHAIN
      - name: Prepare pinned development tools
        run: sh scripts/setup-devtools.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Assert minimum toolchain
        run: |
          test "$(go version)" = 'go version go${{ matrix.go }} linux/amd64'
          go version
          go env GOTOOLCHAIN GOHOSTARCH
      - name: Verify failure propagation
        run: python3 scripts/test_ci_go_verify.py
      - name: Verify application toolchain
        run: sh scripts/ci-go-verify.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and dogfood all checks
        run: |
          go build -o "$RUNNER_TEMP/naru" ./cmd/naru
          "$RUNNER_TEMP/naru" check
      - name: Print analysis summaries
        if: always()
        run: |
          find .naru/state -name issues.md -type f -exec cat {} \;
